name : CI/CD workflow

on: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: set node
        uses: actions/setup-node@v7
        with:
            node-version: 24
            package-manager-cache: false # Disable automatic npm caching if not required
      - run: npm ci
      - run: npm test
